<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-label="緑ヶ丘駅東口から、そよぎ整骨院までのイラスト地図（架空）">
  <defs>
    <pattern id="grass" width="40" height="40" patternUnits="userSpaceOnUse">
      <rect width="40" height="40" fill="#EEF5EC"/>
      <circle cx="10" cy="12" r="1.6" fill="#D3E5D2"/><circle cx="30" cy="30" r="1.6" fill="#D3E5D2"/>
    </pattern>
    <g id="tree"><circle r="22" fill="#8DBE98"/><circle r="22" fill="none" stroke="#6BA37A" stroke-width="3"/><circle cx="-6" cy="-6" r="7" fill="#A9D0B1"/></g>
  </defs>

  <!-- 地面 -->
  <rect width="1600" height="900" fill="url(#grass)"/>

  <!-- 街区 -->
  <g fill="#FFFFFF" stroke="#DCE6DB" stroke-width="3">
    <rect x="60" y="560" width="300" height="280" rx="18"/>
    <rect x="460" y="560" width="380" height="280" rx="18"/>
    <rect x="460" y="60" width="380" height="380" rx="18"/>
    <rect x="940" y="60" width="300" height="380" rx="18"/>
    <rect x="1340" y="60" width="210" height="380" rx="18"/>
    <rect x="1340" y="560" width="210" height="280" rx="18"/>
  </g>

  <!-- 線路 -->
  <rect x="0" y="0" width="70" height="900" fill="#E6E9E6"/>
  <g stroke="#9AA19B" stroke-width="5"><line x1="20" y1="0" x2="20" y2="900"/><line x1="50" y1="0" x2="50" y2="900"/></g>
  <g stroke="#9AA19B" stroke-width="3">
    <line x1="10" y1="40" x2="60" y2="40"/><line x1="10" y1="120" x2="60" y2="120"/><line x1="10" y1="200" x2="60" y2="200"/>
    <line x1="10" y1="660" x2="60" y2="660"/><line x1="10" y1="740" x2="60" y2="740"/><line x1="10" y1="820" x2="60" y2="820"/>
  </g>

  <!-- 道路 -->
  <g fill="#F7F4EC">
    <rect x="360" y="0" width="100" height="900"/>
    <rect x="840" y="0" width="100" height="900"/>
    <rect x="1240" y="0" width="100" height="900"/>
    <rect x="70" y="440" width="1530" height="120"/>
  </g>
  <g stroke="#E2DCCB" stroke-width="3" stroke-dasharray="22 18">
    <line x1="70" y1="500" x2="1600" y2="500"/>
  </g>

  <!-- 駅舎 -->
  <rect x="80" y="230" width="270" height="200" rx="20" fill="#3E6B4C"/>
  <text x="215" y="320" text-anchor="middle" font-family="'Zen Maru Gothic','Yu Gothic',sans-serif" font-weight="700" font-size="40" fill="#FFFFFF">緑ヶ丘駅</text>
  <text x="215" y="368" text-anchor="middle" font-family="'Quicksand',sans-serif" font-weight="700" font-size="22" fill="#DCEBDD" letter-spacing="3">MIDORIGAOKA</text>
  <!-- 東口 -->
  <rect x="290" y="430" width="70" height="20" fill="#3E6B4C"/>
  <rect x="244" y="452" width="112" height="44" rx="22" fill="#E59C5A"/>
  <text x="300" y="483" text-anchor="middle" font-family="'Zen Maru Gothic','Yu Gothic',sans-serif" font-weight="700" font-size="24" fill="#3A2414">東口</text>

  <!-- ロータリー -->
  <circle cx="200" cy="700" r="90" fill="#F7F4EC" stroke="#E2DCCB" stroke-width="3"/>
  <circle cx="200" cy="700" r="48" fill="#DCEBDD"/>
  <text x="200" y="820" text-anchor="middle" font-family="'Yu Gothic',sans-serif" font-size="24" fill="#646E67">ロータリー</text>

  <!-- 街路樹 -->
  <g>
    <use href="#tree" x="520" y="590"/><use href="#tree" x="600" y="590"/><use href="#tree" x="680" y="590"/><use href="#tree" x="760" y="590"/>
    <use href="#tree" x="520" y="410"/><use href="#tree" x="600" y="410"/><use href="#tree" x="680" y="410"/><use href="#tree" x="760" y="410"/>
    <use href="#tree" x="1000" y="410"/><use href="#tree" x="1080" y="410"/>
    <use href="#tree" x="1000" y="590"/><use href="#tree" x="1080" y="590"/>
  </g>
  <text x="640" y="680" text-anchor="middle" font-family="'Yu Gothic',sans-serif" font-size="24" fill="#646E67">街路樹の通り</text>

  <!-- 周辺の目印 -->
  <g font-family="'Yu Gothic',sans-serif" font-size="24" fill="#646E67" text-anchor="middle">
    <rect x="500" y="140" width="300" height="120" rx="14" fill="#F4F8F3" stroke="#DCE6DB" stroke-width="3"/>
    <text x="650" y="210">コンビニ</text>
    <rect x="980" y="640" width="220" height="110" rx="14" fill="#F4F8F3" stroke="#DCE6DB" stroke-width="3"/>
    <text x="1090" y="705">コインパーキング</text>
    <text x="1090" y="735" font-size="18">Ｐ</text>
  </g>

  <!-- 道順 -->
  <path d="M300 500 L1160 500 L1160 420" fill="none" stroke="#E59C5A" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="2 26"/>
  <g font-family="'Quicksand',sans-serif" font-weight="700" font-size="22" fill="#FFFFFF" text-anchor="middle">
    <circle cx="380" cy="530" r="20" fill="#3E6B4C"/><text x="380" y="538">1</text>
    <circle cx="720" cy="530" r="20" fill="#3E6B4C"/><text x="720" y="538">2</text>
    <circle cx="1190" cy="460" r="20" fill="#3E6B4C"/><text x="1190" y="468">3</text>
  </g>

  <!-- 院のビル -->
  <rect x="980" y="110" width="220" height="250" rx="16" fill="#FFFFFF" stroke="#6BA37A" stroke-width="5"/>
  <text x="1090" y="330" text-anchor="middle" font-family="'Yu Gothic',sans-serif" font-size="22" fill="#646E67">そよかぜビル 1F</text>
  <!-- ピン -->
  <g transform="translate(1090 230)">
    <path d="M0 40C-30 6-44-12-44-34a44 44 0 0 1 88 0c0 22-14 40-44 74z" fill="#E59C5A" transform="translate(0 -40)"/>
    <circle cx="0" cy="-74" r="26" fill="#FFFFFF"/>
    <path d="M1 -58c-12-5-15-14-12-27 9 2 17 6 19 14 1 6-2 10-7 13z" fill="#6BA37A"/>
  </g>
  <g>
    <rect x="930" y="26" width="320" height="64" rx="32" fill="#3E6B4C"/>
    <text x="1090" y="68" text-anchor="middle" font-family="'Zen Maru Gothic','Yu Gothic',sans-serif" font-weight="700" font-size="28" fill="#FFFFFF">そよぎ整骨院・整体院</text>
  </g>

  <!-- 方位・注記 -->
  <g transform="translate(1480 800)">
    <circle r="40" fill="#FFFFFF" stroke="#DCE6DB" stroke-width="3"/>
    <path d="M0-28 10 6 0 0-10 6z" fill="#3E6B4C"/>
    <text y="30" text-anchor="middle" font-family="'Quicksand',sans-serif" font-weight="700" font-size="18" fill="#3E6B4C">N</text>
  </g>
  <text x="1580" y="885" text-anchor="end" font-family="'Yu Gothic',sans-serif" font-size="18" fill="#646E67">※架空の地図です　徒歩約3分</text>
</svg>
